baseURL = 'https://jachapman.github.io/writing/'
locale = 'en-us'
title = 'Joseph Chapman'
theme = 'congo'

[pagination]
pagerSize = 10

[params]
description = 'Essays, book reviews, political and historical commentary, and personal reflections.'
colorScheme = 'congo'
defaultAppearance = 'dark'
autoSwitchAppearance = false
enableSearch = true
enableCodeCopy = true

[params.author]
name = 'Joseph Chapman'
headline = 'Essays, book reviews, and things I think about outside of cybersecurity.'

[header]
layout = 'basic'
showTitle = true

[footer]
showCopyright = true
showThemeAttribution = false
showScrollToTop = true

[homepage]
layout = 'page'
showRecent = true
recentLimit = 5

[article]
showDate = true
showAuthor = true
showBreadcrumbs = true
showDraftLabel = true
showHeadingAnchors = true
showReadingTime = true
showTableOfContents = true
showWordCount = false
showComments = false

[list]
showBreadcrumbs = true
showSummary = true
showTableOfContents = false

